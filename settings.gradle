pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Babric'
			url = 'https://maven.glass-launcher.net/babric'
		}
		maven { url = 'https://jitpack.io/' }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "fbx-player-models-multiversion"

include("common")
include("client-common")

def requestedLoaderProjects = gradle.startParameter.taskNames
		.collect { it.startsWith(":") ? it.substring(1) : it }
		.findAll { it.startsWith("fabric-") || it.startsWith("forge-") }
		.collect { it.split(":")[0] }
		.toSet()

def includeAllLoaderProjects = requestedLoaderProjects.isEmpty()

if (includeAllLoaderProjects || requestedLoaderProjects.contains("fabric-1.21.1")) {
	include("fabric-1.21.1")
}

if (includeAllLoaderProjects || requestedLoaderProjects.contains("fabric-26.3")) {
	include("fabric-26.3")
}

if (includeAllLoaderProjects || requestedLoaderProjects.contains("fabric-26.3-client")) {
	include("fabric-26.3-client")
}

if (includeAllLoaderProjects || requestedLoaderProjects.contains("fabric-b1.7.3")) {
	include("fabric-b1.7.3")
}

if (includeAllLoaderProjects || requestedLoaderProjects.contains("forge-1.21.1")) {
	include("forge-1.21.1")
}

if (includeAllLoaderProjects || requestedLoaderProjects.contains("fabric-1.21.1-client")) {
	include("fabric-1.21.1-client")
}
