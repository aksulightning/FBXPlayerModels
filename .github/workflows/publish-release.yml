name: Publish reviewed release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Manual release build run ID to publish
        type: string
        required: true
      target:
        description: Reviewed artifact to publish
        type: choice
        options:
          - fabric-1.21.1
          - fabric-26.2
          - forge-1.21.1
          - fabric-b1.7.3
      destination:
        description: Publish destination
        type: choice
        default: modrinth
        options:
          - modrinth
          - github
      version:
        description: Built release version (for example 2.0.0); must match the reviewed jar
        type: string
        required: true
      channel:
        description: Release channel
        type: choice
        default: alpha
        options:
          - alpha
          - beta
          - release
      release_tag:
        description: New GitHub tag (GitHub destination only; existing tags are refused)
        type: string
      notes:
        description: Release notes
        type: string
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/modrinth-last-update'
    runs-on: ubuntu-24.04
    steps:
      - name: Locate successful manual build
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['BUILD_RUN_ID']
          if not re.fullmatch(r'[0-9]+', run_id):
              raise ValueError('Build run ID must be numeric')
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          if (run['conclusion'] != 'success' or run['event'] != 'workflow_dispatch'
                  or run['head_branch'] != 'modrinth-last-update'
                  or run['path'].split('@')[0] != '.github/workflows/nightly.yml'
                  or run['head_repository']['full_name'] != repo):
              raise ValueError('Select a successful manual release build from modrinth-last-update')
          commit = run['head_sha']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise ValueError('Invalid build commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'commit={commit}\n')
          PY
      - name: Check out the built source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false
      - name: Download reviewed artifact
        uses: actions/download-artifact@v5
        with:
          name: fbx-player-models-${{ inputs.target }}
          path: .release/${{ inputs.target }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}
      - name: Verify jar and provenance
        id: artifact
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python3 .github/scripts/release_metadata.py verify "$RELEASE_TARGET"
      - name: Publish to Modrinth
        if: inputs.destination == 'modrinth'
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_ID }}
          name: ${{ steps.artifact.outputs.title }}
          version: ${{ steps.artifact.outputs.version }}
          channel: ${{ inputs.channel }}
          loaders: ${{ steps.artifact.outputs.loader }}
          game-versions: ${{ steps.artifact.outputs.minecraft }}
          changelog: ${{ inputs.notes }}
          files: ${{ steps.artifact.outputs.file }}
      - name: Publish a new GitHub release
        if: inputs.destination == 'github'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ steps.artifact.outputs.title }}
          RELEASE_FILE: ${{ steps.artifact.outputs.file }}
          RELEASE_TARGET: ${{ inputs.target }}
          BUILD_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from urllib.parse import quote
          tag = os.environ['RELEASE_TAG']
          if not tag or tag.startswith('-'):
              raise ValueError('Supply a new GitHub release tag')
          subprocess.run(['git', 'check-ref-format', f'refs/tags/{tag}'], check=True)
          repo = os.environ['GITHUB_REPOSITORY']
          matches = json.loads(subprocess.check_output([
              'gh', 'api', f"repos/{repo}/git/matching-refs/tags/{quote(tag, safe='')}"
          ]))
          if any(item['ref'] == f'refs/tags/{tag}' for item in matches):
              raise ValueError('Tag already exists; existing releases and tags are never replaced')
          args = ['gh', 'release', 'create', tag, os.environ['RELEASE_FILE'],
                  '--repo', os.environ['GITHUB_REPOSITORY'], '--target', os.environ['BUILD_COMMIT'],
                  '--title', os.environ['RELEASE_TITLE'],
                  '--notes-file', f".release/{os.environ['RELEASE_TARGET']}/release-notes.md"]
          if os.environ['RELEASE_CHANNEL'] != 'release':
              args.append('--prerelease')
          subprocess.run(args, check=True)
          PY
