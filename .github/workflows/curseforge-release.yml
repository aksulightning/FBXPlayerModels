name: CurseForge release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Versions to build and publish
        type: choice
        default: fabric-1.21.1
        options:
          - all
          - fabric-1.21.1
          - fabric-1.21.1-client
          - fabric-26.2
          - forge-1.21.1
          - fabric-b1.7.3
      channel:
        description: CurseForge release channel
        type: choice
        default: alpha
        options:
          - alpha
          - beta
          - release
      notes:
        description: Release notes
        type: string
        default: Single-player and LAN release with optional client-only variants.

permissions:
  contents: read
  actions: read

concurrency:
  group: fbx-manual-curseforge-release
  cancel-in-progress: false

env:
  BUILD_SOURCE_BRANCH: ${{ github.ref_name }}
  BUILD_COMMIT: ${{ github.sha }}
  BUILD_RUN_ID: ${{ github.run_id }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_NOTES: ${{ inputs.notes }}

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - name: Check CurseForge publishing configuration
        env:
          CF_PROJECT: ${{ vars.CURSEFORGE_ID }}
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_VERSION_NAMES: ${{ vars.CURSEFORGE_VERSION_NAMES }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          if not re.fullmatch(r"[1-9][0-9]*", os.environ["CF_PROJECT"]):
              raise SystemExit(
                  "Configure repository variable CURSEFORGE_ID "
                  "with your numeric CurseForge project ID."
              )

          if not os.environ["CF_TOKEN"].strip():
              raise SystemExit(
                  "Configure repository secret CURSEFORGE_TOKEN "
                  "with your CurseForge Author API token."
              )

          overrides = json.loads(os.environ["CF_VERSION_NAMES"] or "{}")
          if not isinstance(overrides, dict):
              raise SystemExit(
                  "CURSEFORGE_VERSION_NAMES must be a JSON object."
              )

          for target, names in overrides.items():
              if (
                  not isinstance(names, list)
                  or not names
                  or any(
                      not isinstance(name, str) or not name.strip()
                      for name in names
                  )
              ):
                  raise SystemExit(
                      f"Invalid CurseForge version names for {target}."
                  )

          print("CurseForge publishing configuration is present.")
          PY

  build:
    needs: validate
    uses: ./.github/workflows/nightly.yml
    with:
      target: ${{ inputs.target }}

  preflight:
    needs: build
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.verify.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download built production jars
        uses: actions/download-artifact@v5
        with:
          pattern: fbx-player-models-*
          path: .release/

      - name: Verify all selected artifacts
        id: verify
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          CF_VERSION_NAMES: ${{ vars.CURSEFORGE_VERSION_NAMES }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(".github/scripts").resolve()))
          from release_metadata import output
          from release_publish import verify_downloads

          rows = verify_downloads(os.environ["RELEASE_TARGET"])
          overrides = json.loads(os.environ["CF_VERSION_NAMES"] or "{}")

          loaders = {
              "fabric": "Fabric",
              "forge": "Forge",
              "babric": "Fabric",
          }

          for row in rows:
              names = overrides.get(
                  row["target"],
                  [row["minecraft"], loaders[row["loader"]]],
              )
              if (
                  not isinstance(names, list)
                  or not names
                  or any(
                      not isinstance(name, str) or not name.strip()
                      for name in names
                  )
              ):
                  raise SystemExit(
                      f"Invalid CurseForge version names for {row['target']}."
                  )

              row["curseforge_version_names"] = json.dumps(names)

          output("matrix", json.dumps({"include": rows}))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(
                  f"Verified {len(rows)} release artifacts "
                  "before publication.\n"
              )
          PY

  publish:
    name: Publish ${{ matrix.target }}
    needs: preflight
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download selected production jar
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: .release/${{ matrix.target }}/

      - name: Verify selected artifact
        id: artifact
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 .github/scripts/release_publish.py verify "$RELEASE_TARGET"

      - name: Prepare CurseForge metadata
        env:
          CF_TITLE: ${{ steps.artifact.outputs.title }}
          CF_CHANGELOG: ${{ steps.artifact.outputs.changelog }}
          CF_LOADER: ${{ steps.artifact.outputs.loader }}
          CF_VERSIONS: ${{ matrix.curseforge_version_names }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          channel = os.environ["RELEASE_CHANNEL"]
          if channel not in {"alpha", "beta", "release"}:
              raise SystemExit("Invalid release channel.")

          metadata = {
              "displayName": os.environ["CF_TITLE"],
              "changelog": os.environ["CF_CHANGELOG"],
              "changelogType": "markdown",
              "gameVersionNames": json.loads(os.environ["CF_VERSIONS"]),
              "releaseType": channel,
          }

          if os.environ["CF_LOADER"] == "fabric":
              metadata["relations"] = {
                  "projects": [
                      {
                          "slug": "fabric-api",
                          "type": "requiredDependency",
                      }
                  ]
              }

          Path(".release/curseforge-metadata.json").write_text(
              json.dumps(metadata),
              encoding="utf-8",
          )
          PY

      - name: Create CurseForge release
        env:
          CF_PROJECT: ${{ vars.CURSEFORGE_ID }}
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_FILE: ${{ steps.artifact.outputs.file }}
          CF_TARGET: ${{ matrix.target }}
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 30 \
            --max-time 600 \
            --request POST \
            --header "X-Api-Token: ${CF_TOKEN}" \
            --form "metadata=<.release/curseforge-metadata.json" \
            --form "file=@${CF_FILE};type=application/java-archive" \
            --output .release/curseforge-response.json \
            "https://minecraft.curseforge.com/api/projects/${CF_PROJECT}/upload-file"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          response = json.loads(
              Path(".release/curseforge-response.json").read_text(
                  encoding="utf-8"
              )
          )
          file_id = response.get("id")

          if type(file_id) is not int or file_id <= 0:
              raise SystemExit(
                  "CurseForge did not return a valid uploaded file ID."
              )

          message = (
              f"Uploaded {os.environ['CF_TARGET']} to CurseForge. "
              f"File ID: {file_id}"
          )
          print(message)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(message + "\n")
          PY
