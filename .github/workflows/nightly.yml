name: Manual release build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to build from the branch selected in Run workflow
        type: choice
        default: all
        options:
          - all
          - fabric-1.21.1
          - fabric-1.21.1-client
          - fabric-26.2
          - fabric-26.3
          - fabric-26.3-client
          - forge-1.21.1
          - fabric-b1.7.3

  workflow_call:
    inputs:
      target:
        description: Target module or all
        type: string
        required: true

permissions:
  contents: read

env:
  BUILD_SOURCE_BRANCH: ${{ github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select targets
        id: targets
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: python3 .github/scripts/release_metadata.py matrix "$RELEASE_TARGET"

  build:
    name: Package ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Beta Java 17 compiler
        if: matrix.target == 'fabric-b1.7.3'
        id: java17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: microsoft
      - name: Install Gradle runtime
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: microsoft
      - name: Package production jar and run port tests
        env:
          BUILD_TASK: ${{ matrix.task }}
          RELEASE_TARGET: ${{ matrix.target }}
          JAVA17_PATH: ${{ steps.java17.outputs.path }}
        run: |
          args=()
          if [[ -n "$JAVA17_PATH" ]]; then
            args+=("-Dorg.gradle.java.installations.paths=$JAVA17_PATH")
          fi
          tasks=("$BUILD_TASK")
          if [[ "$RELEASE_TARGET" == forge-1.21.1 || "$RELEASE_TARGET" == fabric-b1.7.3 || "$RELEASE_TARGET" == fabric-1.21.1-client || "$RELEASE_TARGET" == fabric-26.3 || "$RELEASE_TARGET" == fabric-26.3-client ]]; then
            tasks+=(":$RELEASE_TARGET:test")
          fi
          bash ./gradlew "${tasks[@]}" "${args[@]}"
      - name: Record artifact provenance
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 .github/scripts/release_metadata.py prepare "$RELEASE_TARGET"
      - name: Upload production jar and manifest
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: .release/${{ matrix.target }}/
          if-no-files-found: error
