name: One-time alpha release 2026-11-02

on:
  schedule:
    # 13:00 Europe/Helsinki on 2 November = 11:00 UTC.
    # The Python gate includes the year and rejects every other date.
    - cron: '0 11 2 11 *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fbx-one-time-alpha-2026-11-02
  cancel-in-progress: false

env:
  BUILD_SOURCE_BRANCH: main
  BUILD_COMMIT: ${{ github.sha }}
  BUILD_RUN_ID: ${{ github.run_id }}
  RELEASE_NOTES: >-
    Single-player and LAN alpha release. Fabric 1.21.1 and 26.2 support LAN model sharing;
    Forge 1.21.1 and Babric Beta 1.7.3 display the local player's model only.
    Source: https://github.com/aksulightning/FBXPlayerModels

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the one-time release window
        id: gate
        run: python3 .github/scripts/scheduled_release.py gate

  build:
    name: Build and verify ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Beta Java 17 compiler
        if: matrix.target == 'fabric-b1.7.3'
        id: java17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: microsoft
      - name: Install Gradle runtime
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: microsoft
      - name: Build production jar and run available port tests
        env:
          BUILD_TASK: ${{ matrix.task }}
          RELEASE_TARGET: ${{ matrix.target }}
          JAVA17_PATH: ${{ steps.java17.outputs.path }}
        run: |
          args=()
          if [[ -n "$JAVA17_PATH" ]]; then
            args+=("-Dorg.gradle.java.installations.paths=$JAVA17_PATH")
          fi
          tasks=("$BUILD_TASK")
          if [[ "$RELEASE_TARGET" == forge-1.21.1 || "$RELEASE_TARGET" == fabric-b1.7.3 ]]; then
            tasks+=(":$RELEASE_TARGET:test")
          fi
          bash ./gradlew "${tasks[@]}" "${args[@]}"
      - name: Record artifact provenance
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 .github/scripts/release_metadata.py prepare "$RELEASE_TARGET"
      - name: Upload production jar and manifest
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: .release/${{ matrix.target }}/
          if-no-files-found: error

  preflight:
    needs: [prepare, build]
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.verify.outputs.matrix }}
      has_pending: ${{ steps.verify.outputs.has_pending }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: fbx-player-models-*
          path: .release/
      - name: Verify all artifacts and refuse conflicting published versions
        id: verify
        env:
          MODRINTH_PROJECT: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 .github/scripts/scheduled_release.py preflight

  publish:
    name: Publish alpha ${{ matrix.target }}
    needs: [prepare, preflight]
    if: needs.preflight.outputs.has_pending == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: .release/${{ matrix.target }}/
      - name: Recheck artifact and release date
        id: artifact
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ matrix.release_version }}
        run: python3 .github/scripts/scheduled_release.py verify "$RELEASE_TARGET"
      - name: Create Modrinth alpha release
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_ID }}
          name: ${{ steps.artifact.outputs.title }}
          version: ${{ steps.artifact.outputs.version }}
          channel: alpha
          loaders: ${{ steps.artifact.outputs.loader }}
          game-versions: ${{ steps.artifact.outputs.minecraft }}
          changelog: ${{ env.RELEASE_NOTES }}
          files: ${{ steps.artifact.outputs.file }}
