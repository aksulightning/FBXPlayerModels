plugins {
	id 'java-library'
}

group = rootProject.maven_group
version = rootProject.mod_version

sourceSets.main.java.srcDir rootProject.file('session-policy/src/main/java')
sourceSets.test.java.srcDir rootProject.file('session-policy/src/test/java')

repositories {
	mavenCentral()
	maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
	compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.0"
	api "org.joml:joml:1.10.8"
	compileOnly "org.jetbrains:annotations:24.1.0"
	testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
